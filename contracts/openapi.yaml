openapi: 3.0.3

info:
  title: HydraGuard API
  version: 0.1.0
  description: >
    Evidence-first supply-chain ingestion and incident analysis API.
    Registry declarations, lockfile resolutions, and incident evidence
    remain separate so candidate exposure is not confused with confirmed
    package resolution.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Ingestions
  - name: Incidents

paths:
  /ingestions/npm:
    post:
      tags: [Ingestions]
      operationId: createNpmIngestion
      summary: Collect npm registry metadata
      description: >
        Collects package identities, versions, maintainers, publication
        metadata, and declared dependency ranges. This endpoint does not
        claim that any version was installed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpmIngestionRequest"
      responses:
        "202":
          description: Ingestion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: npm registry request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingestions/lockfile:
    post:
      tags: [Ingestions]
      operationId: createLockfileIngestion
      summary: Ingest an npm lockfile
      description: >
        Parses a real package-lock.json and generates exact, evidence-backed
        DEPENDS_ON relationships plus derived USED_BY traversal indexes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockfileIngestionRequest"
      responses:
        "202":
          description: Lockfile ingestion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /ingestions/{ingestionId}:
    get:
      tags: [Ingestions]
      operationId: getIngestion
      summary: Get ingestion job status
      parameters:
        - name: ingestionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current ingestion status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        "404":
          description: Ingestion job not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /incidents:
    post:
      tags: [Incidents]
      operationId: createIncident
      summary: Create an evidence-backed supply-chain incident
      description: >
        Creates an Incident and associates affected package versions or
        version ranges with advisory provenance. Creating an incident does
        not automatically mark consuming services as compromised.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateRequest"
      responses:
        "201":
          description: Incident created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /incidents/{incidentId}/blast-radius:
    get:
      tags: [Incidents]
      operationId: getBlastRadius
      summary: Get blast radius of an incident
      description: Returns the affected services and traversal path metrics for an incident.
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blast radius response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HydraGuardBlastRadiusResponse"
        "404":
          description: Incident not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Stable caller-generated key preventing duplicate asynchronous jobs.
      schema:
        type: string
        minLength: 8
        maxLength: 80

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Identity or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ProvenanceInput:
      type: object
      additionalProperties: false
      required:
        - sourceType
        - sourceUri
        - observedAt
        - collectorVersion
        - confidence
        - synthetic
      properties:
        sourceType:
          type: string
          enum:
            - npm-registry
            - package-manifest
            - package-lock
            - git-commit
            - cyclonedx
            - spdx
            - slsa
            - sigstore
            - runtime-telemetry
            - security-advisory
            - synthetic-fixture
            - other
        sourceUri:
          type: string
          format: uri
        observedAt:
          type: string
          format: date-time
        collectorVersion:
          type: string
          minLength: 1
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        synthetic:
          type: boolean

    NpmPackageRoot:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 214
          example: "@tanstack/react-router"
        versions:
          type: array
          description: >
            Explicit versions to collect. If omitted, the latest dist-tag
            version is collected.
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1

    NpmIngestionRequest:
      type: object
      additionalProperties: false
      required:
        - roots
        - maxPackages
        - maxDepth
      properties:
        roots:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/NpmPackageRoot"
        maxPackages:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        maxDepth:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
        includeDevDependencies:
          type: boolean
          default: false

    LockfileIngestionRequest:
      type: object
      additionalProperties: false
      required:
        - serviceLogicalId
        - serviceName
        - serviceCriticality
        - format
        - lockfile
        - provenance
      properties:
        serviceLogicalId:
          type: string
          pattern: "^service:"
          example: "service:demo-org:payment-api"
        repositoryLogicalId:
          type: string
          pattern: "^repo:"
          example: "repo:github:demo-org/payment-api"
        format:
          type: string
          enum:
            - npm-package-lock-v2
            - npm-package-lock-v3
        lockfile:
          type: object
          description: Parsed package-lock.json JSON object.
          additionalProperties: true
        provenance:
          $ref: "#/components/schemas/ProvenanceInput"
        serviceName:
          type: string
          minLength: 1

        serviceCriticality:
          type: string
          enum: [low, medium, high, critical]

    AffectedRelease:
      type: object
      additionalProperties: false
      required:
        - packageName
      properties:
        packageName:
          type: string
          minLength: 1
          example: "bad-lib"
        affectedRange:
          type: string
          example: ">=1.2.4 <1.2.5"
        exactVersions:
          type: array
          uniqueItems: true
          items:
            type: string
          example:
            - "1.2.4"

    IncidentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - intervalStart
        - affectedReleases
        - provenance
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        intervalStart:
          type: string
          format: date-time
        intervalEnd:
          type: string
          format: date-time
          nullable: true
        affectedReleases:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/AffectedRelease"
        provenance:
          $ref: "#/components/schemas/ProvenanceInput"

    IngestionAccepted:
      type: object
      additionalProperties: false
      required:
        - ingestionId
        - status
        - submittedAt
      properties:
        ingestionId:
          type: string
        status:
          type: string
          enum: [queued]
        submittedAt:
          type: string
          format: date-time

    IngestionJob:
      type: object
      additionalProperties: false
      required:
        - ingestionId
        - status
        - submittedAt
      properties:
        ingestionId:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - partially-completed
            - failed
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        nodeCount:
          type: integer
          minimum: 0
        edgeCount:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: string

    IncidentCreated:
      type: object
      additionalProperties: false
      required:
        - incidentId
        - logicalId
        - status
      properties:
        incidentId:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        logicalId:
          type: string
          pattern: "^incident:"
        status:
          type: string
          enum: [draft, active]

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
    HydraGuardFunnelCounts:
      type: object
      additionalProperties: false
      required:
        - candidate
        - semverEligible
        - resolved
        - built
        - deployed
        - runtimeReachable
        - executionObserved
      properties:
        candidate:
          type: integer
          minimum: 0
        semverEligible:
          type: integer
          minimum: 0
        resolved:
          type: integer
          minimum: 0
        built:
          type: integer
          minimum: 0
        deployed:
          type: integer
          minimum: 0
        runtimeReachable:
          type: integer
          minimum: 0
        executionObserved:
          type: integer
          minimum: 0

    HydraGuardBlastRadiusResponse:
      type: object
      additionalProperties: false
      required:
        - incidentId
        - executionMs
        - services
        - totalPathCount
        - truncated
        - limits
        - funnel
      properties:
        incidentId:
          type: integer
        executionMs:
          type: integer
          minimum: 0
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - serviceId
              - serviceName
              - criticality
              - minimumDepth
              - pathCount
            properties:
              serviceId:
                type: integer
              serviceName:
                type: string
              criticality:
                type: string
              minimumDepth:
                type: integer
                minimum: 0
              pathCount:
                type: integer
                minimum: 0
        totalPathCount:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        limits:
          type: object
          additionalProperties: true
        funnel:
          $ref: "#/components/schemas/HydraGuardFunnelCounts"
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
