openapi: 3.0.3

info:
  title: HydraGuard API
  version: 0.1.0
  description: >
    Evidence-first supply-chain ingestion and incident analysis API.
    Registry declarations, lockfile resolutions, and incident evidence
    remain separate so candidate exposure is not confused with confirmed
    package resolution.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Ingestions
  - name: Incidents
  - name: Typosquatting

paths:
  /typosquatting/scans:
    post:
      tags: [Typosquatting]
      operationId: createTyposquattingScan
      summary: Scan an npm lockfile for typosquatting findings
      description: >
        Accepts the same evidence-backed lockfile request as lockfile ingestion
        and asynchronously scans its exact package resolutions for
        typosquatting candidates.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockfileIngestionRequest"
      responses:
        "202":
          description: Typosquatting scan accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: A referenced resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: The scan could not be created due to an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The scan service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /typosquatting/findings:
    get:
      tags: [Typosquatting]
      operationId: listTyposquattingFindings
      summary: List typosquatting findings
      description: >
        Returns a bounded page of findings. cursorDetectedAt and
        cursorFindingId must either both be supplied or both be omitted.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursorDetectedAt
          in: query
          required: false
          description: Supply together with cursorFindingId.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: cursorFindingId
          in: query
          required: false
          description: Supply together with cursorDetectedAt.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: A bounded page of typosquatting findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyposquattingFindingListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: A referenced resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: Findings could not be listed due to an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The findings service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /typosquatting/findings/{findingId}:
    get:
      tags: [Typosquatting]
      operationId: getTyposquattingFinding
      summary: Get a typosquatting finding
      parameters:
        - $ref: "#/components/parameters/TyposquattingFindingId"
      responses:
        "200":
          description: Detailed finding, evidence, versions, and exposure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyposquattingFindingDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The finding was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: The finding could not be read due to an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The findings service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /typosquatting/findings/{findingId}/dismiss:
    post:
      tags: [Typosquatting]
      operationId: dismissTyposquattingFinding
      summary: Dismiss a typosquatting finding
      security:
        - analystBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TyposquattingFindingId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TyposquattingFindingReviewRequest"
      responses:
        "200":
          description: Finding dismissed, or the prior response replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyposquattingFindingReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AnalystAuthenticationRequired"
        "404":
          description: The finding was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: The finding could not be reviewed due to an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The findings service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /typosquatting/findings/{findingId}/promote:
    post:
      tags: [Typosquatting]
      operationId: promoteTyposquattingFinding
      summary: Promote a typosquatting finding
      description: Replays the deterministic confirmation graph when repairing a prior partial persistence failure.
      security:
        - analystBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TyposquattingFindingId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TyposquattingFindingReviewRequest"
      responses:
        "200":
          description: Finding promoted, repaired, or the prior response replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TyposquattingFindingReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AnalystAuthenticationRequired"
        "404":
          description: The finding was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: The finding could not be reviewed due to an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The findings service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingestions/npm:
    post:
      tags: [Ingestions]
      operationId: createNpmIngestion
      summary: Collect npm registry metadata
      description: >
        Collects package identities, versions, maintainers, publication
        metadata, and declared dependency ranges. This endpoint does not
        claim that any version was installed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpmIngestionRequest"
      responses:
        "202":
          description: Ingestion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: npm registry request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingestions/lockfile:
    post:
      tags: [Ingestions]
      operationId: createLockfileIngestion
      summary: Ingest an npm lockfile
      description: >
        Parses a real package-lock.json and generates exact, evidence-backed
        DEPENDS_ON relationships plus derived USED_BY traversal indexes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockfileIngestionRequest"
      responses:
        "202":
          description: Lockfile ingestion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /ingestions/{ingestionId}:
    get:
      tags: [Ingestions]
      operationId: getIngestion
      summary: Get ingestion job status
      parameters:
        - name: ingestionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current ingestion status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        "404":
          description: Ingestion job not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: List persisted incidents
      description: >
        Bounded, newest-first incident index ordered by (observedAt, id)
        descending. affectedVersionCount counts canonical AFFECTS targets only
        and does not assert that any dependent service was exposed.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursorObservedAt
          in: query
          required: false
          description: Must be supplied together with cursorId.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: cursorId
          in: query
          required: false
          description: Must be supplied together with cursorObservedAt.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: A bounded page of incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: The incident index is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Incidents]
      operationId: createIncident
      summary: Create an evidence-backed supply-chain incident
      description: >
        Creates an Incident and associates affected package versions or
        version ranges with advisory provenance. Creating an incident does
        not automatically mark consuming services as compromised.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentCreateRequest"
      responses:
        "201":
          description: Incident created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /incidents/{incidentId}/blast-radius:
    get:
      tags: [Incidents]
      operationId: getBlastRadius
      summary: Get blast radius of an incident
      description: Returns the affected services and traversal path metrics for an incident.
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blast radius response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HydraGuardBlastRadiusResponse"
        "404":
          description: Incident not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    analystBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque analyst token
      description: The API maps this token to a trusted server-configured analyst principal.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Stable caller-generated key preventing duplicate asynchronous jobs.
      schema:
        type: string
        minLength: 8
        maxLength: 80
        pattern: "^[A-Za-z0-9._-]{8,80}$"

    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller-generated key preventing duplicate reviews.
      schema:
        type: string
        minLength: 8
        maxLength: 80
        pattern: "^[A-Za-z0-9._-]{8,80}$"

    TyposquattingFindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]{0,15})$"
        maxLength: 16

  responses:
    AnalystAuthenticationRequired:
      description: A valid analyst bearer token is required.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer authentication challenge.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Identity or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    TyposquattingId:
      type: integer
      minimum: 0
      maximum: 9007199254740991

    TyposquattingFindingStatus:
      type: string
      enum:
        - candidate
        - suspicious
        - high-confidence
        - confirmed
        - dismissed

    TyposquattingTransformation:
      type: string
      enum:
        - adjacent-transposition
        - insertion
        - deletion
        - substitution
        - separator-variation
        - repeated-character
        - scope-impersonation
        - unicode-confusable
        - prefix-suffix

    TyposquattingFindingSummary:
      type: object
      additionalProperties: false
      required:
        - findingId
        - status
        - score
        - scoreMeaning
        - candidateName
        - targetName
        - summary
        - transformations
        - reasonCodes
        - detectedAt
        - synthetic
      properties:
        findingId:
          $ref: "#/components/schemas/TyposquattingId"
        status:
          $ref: "#/components/schemas/TyposquattingFindingStatus"
        score:
          type: number
          minimum: 0
          maximum: 100
        scoreMeaning:
          type: string
          enum: [heuristic-ranking-not-probability]
        candidateName:
          type: string
          minLength: 1
          maxLength: 214
        targetName:
          type: string
          minLength: 1
          maxLength: 214
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        transformations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TyposquattingTransformation"
        reasonCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        detectedAt:
          $ref: "#/components/schemas/TyposquattingId"
        decidedAt:
          $ref: "#/components/schemas/TyposquattingId"
        decisionReason:
          type: string
          minLength: 1
          maxLength: 2000
        synthetic:
          type: boolean

    TyposquattingFindingCursor:
      type: object
      additionalProperties: false
      required:
        - detectedAt
        - findingId
      properties:
        detectedAt:
          $ref: "#/components/schemas/TyposquattingId"
        findingId:
          $ref: "#/components/schemas/TyposquattingId"

    TyposquattingFindingListResponse:
      type: object
      additionalProperties: false
      required:
        - findings
        - truncated
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/TyposquattingFindingSummary"
        truncated:
          type: boolean
        nextCursor:
          $ref: "#/components/schemas/TyposquattingFindingCursor"

    TyposquattingEvidenceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceType
        - confidence
        - observedAt
        - synthetic
      properties:
        id:
          $ref: "#/components/schemas/TyposquattingId"
        sourceType:
          type: string
          minLength: 1
          maxLength: 64
        confidence:
          type: number
          minimum: 0
          maximum: 1
        observedAt:
          $ref: "#/components/schemas/TyposquattingId"
        synthetic:
          type: boolean

    TyposquattingExactVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - synthetic
      properties:
        id:
          $ref: "#/components/schemas/TyposquattingId"
        version:
          type: string
          minLength: 1
          maxLength: 256
        synthetic:
          type: boolean

    TyposquattingVersionLookup:
      type: object
      additionalProperties: false
      required:
        - scannedCount
        - truncated
      properties:
        scannedCount:
          type: integer
          minimum: 0
          maximum: 1000
        truncated:
          type: boolean

    TyposquattingExposureService:
      type: object
      additionalProperties: false
      required:
        - serviceId
        - serviceLogicalId
        - serviceName
        - serviceCriticality
        - packageVersionIds
        - evidenceIds
      properties:
        serviceId:
          $ref: "#/components/schemas/TyposquattingId"
        serviceLogicalId:
          type: string
          minLength: 1
          maxLength: 512
        serviceName:
          type: string
          minLength: 1
          maxLength: 200
        serviceCriticality:
          type: string
          enum: [low, medium, high, critical]
        packageVersionIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TyposquattingId"
        evidenceIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TyposquattingId"

    TyposquattingExposureLimits:
      type: object
      additionalProperties: false
      required:
        - maxDepth
        - maxServices
        - maxTraversalStates
        - maxDependentsPerNode
      properties:
        maxDepth:
          type: integer
          minimum: 1
        maxServices:
          type: integer
          minimum: 1
        maxTraversalStates:
          type: integer
          minimum: 1
        maxDependentsPerNode:
          type: integer
          minimum: 1

    TyposquattingExposure:
      type: object
      additionalProperties: false
      required:
        - services
        - truncated
        - traversalStates
        - limits
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/TyposquattingExposureService"
        truncated:
          type: boolean
        traversalStates:
          type: integer
          minimum: 0
          maximum: 10000
        limits:
          $ref: "#/components/schemas/TyposquattingExposureLimits"

    TyposquattingFindingDetailResponse:
      type: object
      additionalProperties: false
      required:
        - finding
        - candidatePackageId
        - targetPackageId
        - evidence
        - exactVersions
        - versionLookup
        - exposure
        - incidentIds
      properties:
        finding:
          $ref: "#/components/schemas/TyposquattingFindingSummary"
        candidatePackageId:
          $ref: "#/components/schemas/TyposquattingId"
        targetPackageId:
          $ref: "#/components/schemas/TyposquattingId"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/TyposquattingEvidenceSummary"
        exactVersions:
          type: array
          items:
            $ref: "#/components/schemas/TyposquattingExactVersion"
        versionLookup:
          $ref: "#/components/schemas/TyposquattingVersionLookup"
        exposure:
          $ref: "#/components/schemas/TyposquattingExposure"
        incidentIds:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TyposquattingId"

    TyposquattingFindingReviewRequest:
      type: object
      additionalProperties: false
      description: Reviewer identity is derived from the authenticated analyst principal, never from this body.
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^\S(?:[\s\S]*\S)?$'

    TyposquattingFindingReviewResponse:
      type: object
      additionalProperties: false
      required:
        - finding
        - replayed
      properties:
        finding:
          $ref: "#/components/schemas/TyposquattingFindingSummary"
        incidentId:
          $ref: "#/components/schemas/TyposquattingId"
        replayed:
          type: boolean

    ProvenanceInput:
      type: object
      additionalProperties: false
      required:
        - sourceType
        - sourceUri
        - observedAt
        - collectorVersion
        - confidence
        - synthetic
      properties:
        sourceType:
          type: string
          enum:
            - npm-registry
            - package-manifest
            - package-lock
            - git-commit
            - cyclonedx
            - spdx
            - slsa
            - sigstore
            - runtime-telemetry
            - security-advisory
            - synthetic-fixture
            - other
        sourceUri:
          type: string
          format: uri
        observedAt:
          type: string
          format: date-time
        collectorVersion:
          type: string
          minLength: 1
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        synthetic:
          type: boolean

    NpmPackageRoot:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 214
          example: "@tanstack/react-router"
        versions:
          type: array
          description: >
            Explicit versions to collect. If omitted, the latest dist-tag
            version is collected.
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1

    NpmIngestionRequest:
      type: object
      additionalProperties: false
      required:
        - roots
        - maxPackages
        - maxDepth
      properties:
        roots:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/NpmPackageRoot"
        maxPackages:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        maxDepth:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
        includeDevDependencies:
          type: boolean
          default: false

    LockfileIngestionRequest:
      type: object
      additionalProperties: false
      required:
        - serviceLogicalId
        - serviceName
        - serviceCriticality
        - format
        - lockfile
        - provenance
      properties:
        serviceLogicalId:
          type: string
          pattern: "^service:"
          example: "service:demo-org:payment-api"
        repositoryLogicalId:
          type: string
          pattern: "^repo:"
          example: "repo:github:demo-org/payment-api"
        format:
          type: string
          enum:
            - npm-package-lock-v2
            - npm-package-lock-v3
        lockfile:
          type: object
          description: Parsed package-lock.json JSON object.
          additionalProperties: true
        provenance:
          $ref: "#/components/schemas/ProvenanceInput"
        serviceName:
          type: string
          minLength: 1

        serviceCriticality:
          type: string
          enum: [low, medium, high, critical]

    AffectedRelease:
      type: object
      additionalProperties: false
      required:
        - packageName
      properties:
        packageName:
          type: string
          minLength: 1
          example: "bad-lib"
        affectedRange:
          type: string
          example: ">=1.2.4 <1.2.5"
        exactVersions:
          type: array
          uniqueItems: true
          items:
            type: string
          example:
            - "1.2.4"

    IncidentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - intervalStart
        - affectedReleases
        - provenance
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        intervalStart:
          type: string
          format: date-time
        intervalEnd:
          type: string
          format: date-time
          nullable: true
        affectedReleases:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/AffectedRelease"
        provenance:
          $ref: "#/components/schemas/ProvenanceInput"

    IngestionAccepted:
      type: object
      additionalProperties: false
      required:
        - ingestionId
        - status
        - submittedAt
      properties:
        ingestionId:
          type: string
        status:
          type: string
          enum: [queued]
        submittedAt:
          type: string
          format: date-time

    IngestionJob:
      type: object
      additionalProperties: false
      required:
        - ingestionId
        - status
        - submittedAt
      properties:
        ingestionId:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - partially-completed
            - failed
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        nodeCount:
          type: integer
          minimum: 0
        edgeCount:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: string

    IncidentCreated:
      type: object
      additionalProperties: false
      required:
        - incidentId
        - logicalId
        - status
      properties:
        incidentId:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        logicalId:
          type: string
          pattern: "^incident:"
        status:
          type: string
          enum: [draft, active]

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
    HydraGuardFunnelCounts:
      type: object
      additionalProperties: false
      required:
        - candidate
        - semverEligible
        - resolved
        - built
        - deployed
        - runtimeReachable
        - executionObserved
      properties:
        candidate:
          type: integer
          minimum: 0
        semverEligible:
          type: integer
          minimum: 0
        resolved:
          type: integer
          minimum: 0
        built:
          type: integer
          minimum: 0
        deployed:
          type: integer
          minimum: 0
        runtimeReachable:
          type: integer
          minimum: 0
        executionObserved:
          type: integer
          minimum: 0

    IncidentListItem:
      type: object
      additionalProperties: false
      required:
        - incidentId
        - logicalId
        - title
        - status
        - intervalStart
        - intervalEnd
        - affectedVersionCount
        - synthetic
        - observedAt
      properties:
        incidentId:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        logicalId:
          type: string
          pattern: '^incident:[^\s]+$'
          maxLength: 1024
        title:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum: [draft, active, contained, closed]
        intervalStart:
          type: string
          format: date-time
        intervalEnd:
          description: Null means the compromise interval is still open.
          nullable: true
          type: string
          format: date-time
        affectedVersionCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        synthetic:
          type: boolean
        observedAt:
          type: string
          format: date-time

    IncidentListResponse:
      type: object
      additionalProperties: false
      required: [incidents, truncated, nextCursor]
      properties:
        incidents:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/IncidentListItem"
        truncated:
          type: boolean
        nextCursor:
          nullable: true
          type: object
          additionalProperties: false
          required: [cursorObservedAt, cursorId]
          properties:
            cursorObservedAt:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            cursorId:
              type: integer
              minimum: 0
              maximum: 9007199254740991

    HydraGuardEvidenceIds:
      type: array
      maxItems: 10000
      uniqueItems: true
      items:
        type: integer
        minimum: 0
        maximum: 9007199254740991

    HydraGuardConfidenceAssessment:
      type: object
      additionalProperties: false
      required: [level, policyVersion, supportingEvidenceIds, reasons, complete, synthetic]
      properties:
        level:
          type: string
          enum: [confirmed, strong, probable, possible, contextual, unknown]
        policyVersion:
          type: string
          enum: [service-impact-v1]
        supportingEvidenceIds:
          $ref: "#/components/schemas/HydraGuardEvidenceIds"
        reasons:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 2048
        complete:
          type: boolean
        synthetic:
          type: boolean

    HydraGuardEvidenceFactAssessment:
      type: object
      additionalProperties: false
      required: [status, evidenceIds, reason]
      properties:
        status:
          type: string
          enum: [proven, not-proven, unknown]
        evidenceIds:
          $ref: "#/components/schemas/HydraGuardEvidenceIds"
        reason:
          type: string
          minLength: 1
          maxLength: 2048

    HydraGuardPathImpactAssessment:
      type: object
      additionalProperties: false
      required: [pathKey, stage, conclusion, confidence, evidenceIds, missingEvidenceIds, uncertainties]
      properties:
        pathKey:
          type: string
          minLength: 1
          maxLength: 32768
        stage:
          type: string
          enum: [candidate, semver-eligible, resolved, built, deployed, runtime-reachable, execution-observed]
        conclusion:
          type: string
          enum: [candidate, affected, exposed, reachable, executed]
        confidence:
          $ref: "#/components/schemas/HydraGuardConfidenceAssessment"
        evidenceIds:
          $ref: "#/components/schemas/HydraGuardEvidenceIds"
        missingEvidenceIds:
          $ref: "#/components/schemas/HydraGuardEvidenceIds"
        uncertainties:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 2048

    HydraGuardImpactAffectedVersion:
      type: object
      additionalProperties: false
      required: [id, packageName, version]
      properties:
        id:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        packageName:
          type: string
          minLength: 1
          maxLength: 512
        version:
          type: string
          minLength: 1
          maxLength: 256

    HydraGuardServiceSelectionAssessment:
      type: object
      additionalProperties: false
      required: [state, dependencyTypes, declaredRanges, lockfilePaths, resolvedVersions, reason]
      properties:
        state:
          type: string
          enum: [exactly-resolved, unknown]
        dependencyTypes:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [production, development, optional, peer]
        declaredRanges:
          type: array
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
            maxLength: 1024
        lockfilePaths:
          type: array
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
            maxLength: 4096
        resolvedVersions:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/HydraGuardImpactAffectedVersion"
        reason:
          type: string
          minLength: 1
          maxLength: 2048

    HydraGuardServiceImpact:
      type: object
      additionalProperties: false
      required: [serviceId, stage, conclusion, confidence, summary, selection, temporal, build, deployment, runtime, authority, paths, evidenceIds, missingEvidence, warnings, complete, synthetic]
      properties:
        serviceId:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        stage:
          type: string
          enum: [candidate, semver-eligible, resolved, built, deployed, runtime-reachable, execution-observed]
        conclusion:
          type: string
          enum: [candidate, affected, exposed, reachable, executed]
        confidence:
          $ref: "#/components/schemas/HydraGuardConfidenceAssessment"
        summary:
          type: string
          minLength: 1
          maxLength: 4096
        selection:
          $ref: "#/components/schemas/HydraGuardServiceSelectionAssessment"
        temporal:
          type: object
          additionalProperties: false
          required: [status, asOf, reason]
          properties:
            status:
              type: string
              enum: [unknown]
            asOf:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            reason:
              type: string
              minLength: 1
              maxLength: 2048
        build:
          $ref: "#/components/schemas/HydraGuardEvidenceFactAssessment"
        deployment:
          $ref: "#/components/schemas/HydraGuardEvidenceFactAssessment"
        runtime:
          $ref: "#/components/schemas/HydraGuardEvidenceFactAssessment"
        authority:
          $ref: "#/components/schemas/HydraGuardEvidenceFactAssessment"
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/HydraGuardPathImpactAssessment"
        evidenceIds:
          $ref: "#/components/schemas/HydraGuardEvidenceIds"
        missingEvidence:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
        warnings:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
        complete:
          type: boolean
        synthetic:
          type: boolean

    HydraGuardBlastRadiusResponse:
      type: object
      additionalProperties: false
      required:
        - incidentId
        - executionMs
        - services
        - serviceImpacts
        - totalPathCount
        - truncated
        - limits
        - funnel
      properties:
        incidentId:
          type: integer
        executionMs:
          type: integer
          minimum: 0
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - serviceId
              - serviceName
              - criticality
              - minimumDepth
              - pathCount
            properties:
              serviceId:
                type: integer
              serviceName:
                type: string
              criticality:
                type: string
              minimumDepth:
                type: integer
                minimum: 0
              pathCount:
                type: integer
                minimum: 0
        serviceImpacts:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/HydraGuardServiceImpact"
        totalPathCount:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        limits:
          type: object
          additionalProperties: true
        funnel:
          $ref: "#/components/schemas/HydraGuardFunnelCounts"
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
